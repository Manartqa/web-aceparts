# nginx site for aceparts.co.th on the central nginx host.
#
#   internet ─▶ FortiGate (NAT 80/443, no TLS) ─▶ this nginx (TLS) ─▶ 172.22.22.201:3001
#
# Install: /etc/nginx/sites-available/aceparts.conf, symlinked from
# sites-enabled (or /etc/nginx/conf.d/ on a layout without sites-*).
# Walkthrough and checks: DEPLOYMENT.md.
#
# The canonical host is https://aceparts.co.th (no www), as on the WordPress
# site. Every other address reaches it in one 301.

# Port 80: ACME challenges for certificate renewal, everything else to https.
server {
	listen 80;
	listen [::]:80;
	server_name aceparts.co.th www.aceparts.co.th;

	location /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
	}

	location / {
		return 301 https://aceparts.co.th$request_uri;
	}
}

# Certificate must cover both names. Let's Encrypt paths shown; point these at
# a purchased certificate instead if that is what the host uses.

# www over HTTPS: to the canonical host, in one hop.
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.aceparts.co.th;

	ssl_certificate     /etc/letsencrypt/live/aceparts.co.th/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/aceparts.co.th/privkey.pem;

	return 301 https://aceparts.co.th$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name aceparts.co.th;

	ssl_certificate     /etc/letsencrypt/live/aceparts.co.th/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/aceparts.co.th/privkey.pem;

	# Next.js sends none of these. Short HSTS until the switch is verified,
	# then raise it to 31536000 (go-live checklist in DEPLOYMENT.md).
	add_header Strict-Transport-Security "max-age=300" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# Next streams HTML; buffering it delays first paint for no gain.
	proxy_buffering off;
	client_max_body_size 2m;

	location / {
		proxy_pass http://172.22.22.201:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# OVERWRITE, never $proxy_add_x_forwarded_for. The contact form's rate
		# limit (src/app/contact-us/actions.ts) keys on the left-most entry;
		# appending would let a client choose that entry itself.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}
}
